name: Post to Bluesky (チー牛ラボ)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [bluesky_post, cron_job_bluesky]


permissions:
  contents: write

jobs:
  bluesky-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests atproto Pillow

      - name: Run Bluesky Post
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'tigyu-cosme.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD || 'ebeq-ainb-o63m-tfwc' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: python bluesky_poster.py

      - name: Commit and Push Bluesky History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bluesky_post_history.txt bluesky_engagement_history.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: record bluesky post & engagement history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || true
          fi

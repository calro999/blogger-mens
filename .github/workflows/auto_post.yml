name: Auto Post to Mens Cosmetics Blogger

on:
  schedule:
    # 1日に5回（JST: 08:30, 12:30, 16:30, 19:30, 22:30）
    # UTC: 23:30, 03:30, 07:30, 10:30, 13:30
    - cron: '30 23,3,7,10,13 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [cron_job, auto_post, blogger_post, run]

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
            cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Mens Blogger and Bluesky Post Script
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BLOGGER_SESSION_B64: ${{ secrets.BLOGGER_SESSION_B64 }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'tigyu-cosme.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD || 'ebeq-ainb-o63m-tfwc' }}

        run: python mens_blogger.py

      - name: Commit and Push Cache & History Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_cache.txt latest_blogger_post.json bluesky_post_history.txt bluesky_engagement_history.txt bluesky_text_history.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update blogger and bluesky history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || true
          fi


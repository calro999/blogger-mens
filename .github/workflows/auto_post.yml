name: Auto Post to Mens Cosmetics Blogger

on:
  schedule:
    # 日本時間 (JST) 0:00〜12:00（UTC 15:00〜03:00）に毎時2回 (0分, 30分) 計24回実行
    # 1日20〜23記事以上を確実に投稿
    - cron: '0,30 15-23,0-2 * * *'
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
            cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Run Mens Blogger and Bluesky Post Script with Retry
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BLOGGER_SESSION_B64: ${{ secrets.BLOGGER_SESSION_B64 }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'tigyu-cosme.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD || 'ebeq-ainb-o63m-tfwc' }}
        run: |
          MAX_RETRIES=3
          COUNT=0
          until [ "$COUNT" -ge "$MAX_RETRIES" ]
          do
            echo "=== Execution Attempt $((COUNT + 1)) / $MAX_RETRIES ==="
            python mens_blogger.py && break
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -lt "$MAX_RETRIES" ]; then
              echo "[WARN] Run failed. Waiting 30 seconds before retry..."
              sleep 30
            fi
          done
          if [ "$COUNT" -ge "$MAX_RETRIES" ]; then
            echo "[ERROR] All $MAX_RETRIES attempts failed."
            exit 1
          fi

      - name: Commit and Push Cache & History Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_cache.txt posted_titles.txt recent_themes.txt latest_blogger_post.json bluesky_post_history.txt bluesky_engagement_history.txt bluesky_text_history.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update blogger and bluesky history [skip ci]"
            git pull --rebase origin main || true
            git push origin main || git push || true
          fi

